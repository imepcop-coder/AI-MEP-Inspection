apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-mep-inspection
  namespace: ai-mep
  labels:
    app.kubernetes.io/name: ai-mep-inspection
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-mep-inspection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-mep-inspection
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: YOUR_ACR_NAME.azurecr.io/ai-mep-inspection:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: ai-mep-config
                  key: APP_ENV
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-mep-config
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-mep-secrets
                  key: SESSION_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-mep-secrets
                  key: JWT_SECRET
            - name: MPLCONFIGDIR
              value: /tmp/matplotlib
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: persistent-data
              mountPath: /data
              subPath: db
            - name: persistent-data
              mountPath: /app/uploads
              subPath: uploads
            - name: persistent-data
              mountPath: /app/reports
              subPath: reports
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: ai-mep-data
        - name: temporary-files
          emptyDir:
            sizeLimit: 512Mi