apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ai-mep-proxy-endpoints
  namespace: app-demo
  labels:
    kubernetes.io/service-name: ai-mep-proxy
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      - "10.244.0.243"
    conditions:
      ready: true
  - addresses:
      - "10.244.0.251"
    conditions:
      ready: true
