{% extends "layouts/base.html" %}

{% block title %}Edit Inspection{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h4 class="mb-0">Edit Inspection</h4>
        </div>

        <div class="card-body">

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/inspections/edit/{{ inspection.id }}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Inspection Number</label>
                        <input type="text"
                               class="form-control"
                               name="inspection_no"
                               value="{{ inspection.inspection_no }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Project</label>

                        <select class="form-select"
                                name="project_id"
                                required>

                            {% for project in projects %}

                            <option value="{{ project.id }}"
                                {% if project.id == inspection.project_id %}selected{% endif %}>
                                {{ project.project_name }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Discipline</label>

                        <select class="form-select"
                                name="discipline"
                                required>

                            <option value="MEP" {% if inspection.discipline=="MEP" %}selected{% endif %}>MEP</option>
                            <option value="Mechanical" {% if inspection.discipline=="Mechanical" %}selected{% endif %}>Mechanical</option>
                            <option value="Electrical" {% if inspection.discipline=="Electrical" %}selected{% endif %}>Electrical</option>
                            <option value="Plumbing" {% if inspection.discipline=="Plumbing" %}selected{% endif %}>Plumbing</option>
                            <option value="HVAC" {% if inspection.discipline=="HVAC" %}selected{% endif %}>HVAC</option>
                            <option value="Civil" {% if inspection.discipline=="Civil" %}selected{% endif %}>Civil</option>

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Inspection Date</label>

                        <input type="date"
                               class="form-control"
                               name="inspection_date"
                               value="{{ inspection.inspection_date }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Inspector</label>

                        <input type="text"
                               class="form-control"
                               name="inspector"
                               value="{{ inspection.inspector }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Inspection Type</label>

                        <input type="text"
                               class="form-control"
                               name="inspection_type"
                               value="{{ inspection.inspection_type }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Location</label>

                        <input type="text"
                               class="form-control"
                               name="location"
                               value="{{ inspection.location }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Drawing Number</label>

                        <input type="text"
                               class="form-control"
                               name="drawing_no"
                               value="{{ inspection.drawing_no or '' }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Specification</label>

                        <input type="text"
                               class="form-control"
                               name="specification"
                               value="{{ inspection.specification or '' }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>

                        <select class="form-select"
                                name="status"
                                required>

                            <option value="Open" {% if inspection.status=="Open" %}selected{% endif %}>Open</option>
                            <option value="In Progress" {% if inspection.status=="In Progress" %}selected{% endif %}>In Progress</option>
                            <option value="Closed" {% if inspection.status=="Closed" %}selected{% endif %}>Closed</option>

                        </select>
                    </div>

                    <div class="col-12 mb-3">

                        <label class="form-label">Description</label>

                        <textarea class="form-control"
                                  rows="5"
                                  name="description">{{ inspection.description or '' }}</textarea>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-success">
                    Update Inspection
                </button>

                <a href="/inspections"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
