<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password | AI-MEP Inspection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

</head>

<body class="auth-page">

<div class="auth-card card p-4">

    <div class="text-center mb-3">
        <div class="brand-badge"><i class="bi bi-shield-lock"></i></div>
        <h3 class="auth-title">Reset Password</h3>
        <p class="auth-subtitle">Set a new password for your workspace account</p>
    </div>

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/forgot-password">

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                required>
        </div>

        <div class="mb-4">
            <label>New Password</label>
            <input
                type="password"
                name="new_password"
                class="form-control"
                required>
        </div>

        <button class="btn btn-primary auth-btn w-100">
            Reset Password
        </button>

    </form>

    <div class="text-center mt-3">
        <a href="/login" class="auth-link">Back to Login</a>
    </div>

</div>

</body>

</html>
