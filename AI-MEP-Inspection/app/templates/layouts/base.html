<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Construction Inspection Platform{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/calculators.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/calculator-card.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/ui.css') }}">
    {% block head_extra %}{% endblock %}
</head>

<body class="app-shell">

{% include "layouts/navbar.html" %}

<div class="app-body">
    <div class="container-fluid">
        <div class="row g-0">
            <aside class="col-auto app-sidebar-col">
                {% include "layouts/sidebar.html" %}
            </aside>
            <main class="col main-content px-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</div>

<div class="app-toast-container" id="appToastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='js/ui.js') }}"></script>
<script src="{{ url_for('static', path='js/calculator-card.js') }}"></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
