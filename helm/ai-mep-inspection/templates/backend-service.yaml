apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-mep-inspection.fullname" . }}-backend
  labels:
    {{- include "ai-mep-inspection.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backendService.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-mep-inspection.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
