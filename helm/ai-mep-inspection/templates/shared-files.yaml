apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-mep-inspection.fullname" . }}-shared-files
  labels:
    {{- include "ai-mep-inspection.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.sharedFiles.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.sharedFiles.size }}
