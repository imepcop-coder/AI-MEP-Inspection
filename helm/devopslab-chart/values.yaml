
replicaCount: 1

image:
  repository: aksacr19905.azurecr.io/devopslab
  pullPolicy: Always
  tag: "17"

imagePullSecrets:
  - name: aksacr199055f8a-auth

nameOverride: "devopslab"
fullnameOverride: "devopslab"

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: default

podAnnotations: {}
podLabels:
  app: devopslab

podSecurityContext: {}
securityContext: {}

service:
  type: LoadBalancer
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
