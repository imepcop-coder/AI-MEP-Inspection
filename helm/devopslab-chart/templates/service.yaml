
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devopslab-chart.fullname" . }}
  labels:
    {{- include "devopslab-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: devopslab
