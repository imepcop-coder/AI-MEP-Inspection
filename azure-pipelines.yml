
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - helm/**

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: aimep-inspection
  containerRegistry: aimep55923.azurecr.io
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  imageTag: '$(Build.SourceVersion)'

stages:
  - stage: Build
    displayName: Build and Push Image
    jobs:
      - job: BuildAndPush
        displayName: Build and Push to ACR
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build and Push Image
            inputs:
              azureSubscription: acrServiceConnection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az acr login --name aimep55923

                docker build \
                  -t "$(containerRegistry)/$(imageRepository):$(imageTag)" \
                  -f "$(dockerfilePath)" \
                  "$(Build.SourcesDirectory)"

                docker push "$(containerRegistry)/$(imageRepository):$(imageTag)"

          - publish: $(Build.SourcesDirectory)/helm/ai-mep-inspection
            artifact: helm-chart
            displayName: Publish Helm chart
