trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: ai-mep-inspection
  containerRegistry: aimep55923.azurecr.io
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

stages:
  - stage: Build
    displayName: Build and Push Image
    jobs:
      - job: BuildAndPush
        displayName: Build and Push to ACR
        steps:
          - task: AzureCLI@2
            displayName: Login to ACR and Push Image
            inputs:
              azureSubscription: 'acrServiceConnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name aimep55923

                docker build \
                  -t $(containerRegistry)/$(imageRepository):$(Build.BuildId) \
                  -t $(containerRegistry)/$(imageRepository):latest \
                  -f "$(dockerfilePath)" \
                  "$(Build.SourcesDirectory)"

                docker push $(containerRegistry)/$(imageRepository):$(Build.BuildId)
                docker push $(containerRegistry)/$(imageRepository):latest

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    jobs:
      - job: DeployToAzureVM
        steps:
          - script: |
              echo "Deploying application to Azure VM"
            displayName: Deploy placeholder