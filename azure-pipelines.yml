
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: aimep-inspection
  frontendImageRepository: ai-mep-frontend
  containerRegistry: aimep55923.azurecr.io
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  frontendDockerfilePath: '$(Build.SourcesDirectory)/Dockerfile.frontend'
  imageTag: '$(Build.SourceVersion)'

stages:
  - stage: Build
    displayName: Build and Push Frontend and Backend Images
    jobs:
      - job: BuildAndPush
        displayName: Build and Push to ACR
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build and Push Image
            inputs:
              azureSubscription: acrServiceConnection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az acr login --name aimep55923

                docker build \
                  -t "$(containerRegistry)/$(imageRepository):$(imageTag)" \
                  -f "$(dockerfilePath)" \
                  "$(Build.SourcesDirectory)"

                docker push "$(containerRegistry)/$(imageRepository):$(imageTag)"

                docker build \
                  -t "$(containerRegistry)/$(frontendImageRepository):$(imageTag)" \
                  -f "$(frontendDockerfilePath)" \
                  "$(Build.SourcesDirectory)"

                docker push "$(containerRegistry)/$(frontendImageRepository):$(imageTag)"

          - publish: $(Build.SourcesDirectory)/helm/ai-mep-inspection
            artifact: helm-chart
            displayName: Publish Helm chart
