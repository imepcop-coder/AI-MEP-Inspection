
trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: devopslab
  containerRegistry: aksacr19905.azurecr.io
  dockerRegistryServiceConnection: '873bb22b-c9f7-4d11-8bc3-5b509a9dc353'
  imageTag: '$(Build.BuildId)'
  namespace: app-demo
  deploymentName: devopslab
  containerName: devopslab

stages:
  # Stage 1: Build and push the Docker image
  - stage: Build
    displayName: Build and Push
    jobs:
      - job: BuildAndPush
        displayName: Build Docker Image
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and Push to ACR
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              Dockerfile: '**/Dockerfile'
              tags: |
                $(imageTag)

          - bash: |
              echo "Image pushed:"
              echo "$(containerRegistry)/$(imageRepository):$(imageTag)"
            displayName: Show Image Reference

  # Stage 2: Deploy to AKS
  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployApplication
        displayName: Deploy devopslab
        environment: DevopsLab.ai-mep
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: KubernetesManifest@1
                  displayName: Deploy Application
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: 'REPLACE_WITH_YOUR_KUBERNETES_SERVICE_CONNECTION'
                    namespace: $(namespace)
                    manifests: |
                      $(System.DefaultWorkingDirectory)/manifests/deployment.yml
                      $(System.DefaultWorkingDirectory)/manifests/service.yml
                    containers: |
                      $(containerRegistry)/$(imageRepository):$(imageTag)

                - task: Kubernetes@1
                  displayName: Verify Deployment Rollout
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: 'REPLACE_WITH_YOUR_KUBERNETES_SERVICE_CONNECTION'
                    namespace: $(namespace)
                    command: rollout
                    arguments: status deployment/$(deploymentName) --timeout=180s
