
  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployApplication
        displayName: Deploy devopslab
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Deploy to AKS and verify rollout
            inputs:
              azureSubscription: 'sc-azure-devopslab'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group aks_cluster_group \
                  --name aks_cluster \
                  --overwrite-existing

                kubectl set image deployment/devopslab \
                  devopslab=$(containerRegistry)/$(imageRepository):$(imageTag) \
                  --namespace $(namespace)

                kubectl rollout status deployment/devopslab \
                  --namespace $(namespace) \
                  --timeout=180s
